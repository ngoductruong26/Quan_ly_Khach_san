<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Quản lý khách sạn</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-rose: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: radial-gradient(circle at top right, rgba(79, 70, 229, 0.15), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(6, 182, 212, 0.1), transparent 50%), #0f172a;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 1.2rem auto;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .login-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        .alert-error {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--accent-rose);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 1.2rem;
            display: none;
            text-align: left;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .quick-hint {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: left;
            line-height: 1.5;
        }

        .quick-hint code {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            color: #818cf8;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo-icon">🏨</div>
        <h2 class="login-title">Đăng Nhập Hệ Thống</h2>
        <p class="login-desc">Quản lý Khách Sạn - Dành cho Quản trị & Lễ Tân</p>

        <div id="loginAlert" class="alert-error"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" class="form-control" placeholder="admin hoặc receptionist" value="admin" required>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" class="form-control" placeholder="Mật khẩu" value="123456" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                🔑 Đăng Nhập
            </button>
        </form>

        <div class="quick-hint">
            <strong>📌 Tài khoản dùng thử:</strong><br>
            • Quản trị viên (ADMIN): <code>admin</code> / <code>123456</code><br>
            • Lễ tân (RECEPTIONIST): <code>receptionist</code> / <code>123456</code>
        </div>

        <a href="/" class="back-link">← Quay lại trang chủ</a>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById("loginAlert");
            const btn = document.getElementById("submitBtn");
            
            alertBox.style.display = "none";
            btn.disabled = true;
            btn.innerHTML = "⏳ Đang xác thực...";

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/users/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || "Tên đăng nhập hoặc mật khẩu không đúng!");
                }

                const user = await response.json();
                sessionStorage.setItem("currentUser", JSON.stringify(user));
                window.location.href = "/dashboard";
            } catch (err) {
                alertBox.innerText = "❌ " + err.message;
                alertBox.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.innerHTML = "🔑 Đăng Nhập";
            }
        }
    </script>
</body>
</html>
