spring.application.name=hotel-management


# ======================
# MySQL Configuration
# ======================
spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_khach_san?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=HocDAtabase#99

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ======================
# JPA / Hibernate
# ======================

# Không tự sửa database khi chạy
# vì bạn đã có schema.sql
spring.jpa.hibernate.ddl-auto=none

# Hiển thị câu SQL trên Console
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ======================
# SQL INIT
# ======================

# Cho phép chạy schema.sql khi khởi động
spring.sql.init.mode=always

spring.sql.init.encoding=UTF-8


# ======================
# Server
# ======================

server.port=8080


# ======================
# Swagger OpenAPI
# ======================

springdoc.swagger-ui.path=/swagger-ui.html